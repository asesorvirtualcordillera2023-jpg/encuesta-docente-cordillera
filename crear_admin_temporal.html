<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crear administrador inicial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--verde:#006068;--claro:#00CE7C;--tomate:#E47E3D;--fondo:#f3f8f7}*{box-sizing:border-box}body{margin:0;background:var(--fondo);font-family:Segoe UI,Arial,sans-serif;color:#17393c;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:white;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(0,96,104,.16);border-top:7px solid var(--claro)}h1{color:var(--verde);margin:0 0 12px}p{line-height:1.55}.warning{background:#fff5ee;border-left:5px solid var(--tomate);padding:14px;border-radius:10px;margin:18px 0}.field{display:block;margin:15px 0}.field span{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #bfd2d0;border-radius:11px;font-size:16px}.field input[readonly]{background:#eef6f5}.actions{display:grid;gap:10px;margin-top:20px}button{border:0;border-radius:11px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;background:var(--verde);color:white}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e7f6f2;color:var(--verde)}.msg{margin-top:16px;padding:13px;border-radius:10px;display:none}.ok{display:block;background:#e8fff4;color:#075b38}.err{display:block;background:#fff0f0;color:#a11}.info{display:block;background:#eef7ff;color:#164d78}code{background:#edf3f2;padding:2px 5px;border-radius:5px}</style>
</head>
<body>
<main class="card">
  <h1>Crear administrador inicial</h1>
  <p>Este archivo crea la cuenta de Supabase Authentication para Luis Hernández y después activa su perfil administrativo.</p>
  <div class="warning"><strong>Uso único:</strong> ejecútelo una sola vez y después elimínelo del repositorio y de GitHub Pages.</div>
  <label class="field"><span>Correo</span><input id="email" value="luis.hernandez@cordillera.edu.ec" readonly></label>
  <label class="field"><span>Contraseña inicial</span><input id="password" type="password" placeholder="Escriba ADMIN2026" autocomplete="new-password"></label>
  <div class="actions">
    <button id="createBtn">Crear cuenta y activar administrador</button>
    <button id="loginBtn" class="secondary">La cuenta ya existe: iniciar y reparar perfil</button>
  </div>
  <div id="message" class="msg"></div>
</main>
<script>
const SUPABASE_URL='https://wgdhdetjcvxxubfcsdsl.supabase.co';
const SUPABASE_KEY='sb_publishable_r2oNUov0VGOyqRECVBDP7Q_xdcNne5p';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const email=document.getElementById('email').value;
const pass=document.getElementById('password');
const msg=document.getElementById('message');
function show(text,type='info'){msg.textContent=text;msg.className='msg '+type}
function valid(){if(pass.value.length<8){show('La contraseña debe tener al menos 8 caracteres. Escriba ADMIN2026.','err');return false}return true}
async function activate(){const {error}=await client.rpc('activar_admin_inicial');if(error)throw error;show('Administrador activado correctamente. Ya puede entrar al sistema con LUIS HERNANDEZ y la contraseña registrada. Elimine ahora este archivo temporal.','ok')}
document.getElementById('createBtn').addEventListener('click',async()=>{if(!valid())return;show('Creando cuenta…');try{const {data,error}=await client.auth.signUp({email,password:pass.value,options:{data:{nombre:'LUIS HERNANDEZ'}}});if(error)throw error;if(data.session){await activate()}else{show('La cuenta fue creada, pero Supabase exige confirmar el correo. Revise el correo institucional, confirme el enlace y luego use el botón “La cuenta ya existe”.','info')}}catch(e){const t=String(e.message||e);if(t.toLowerCase().includes('already registered')||t.toLowerCase().includes('already been registered'))show('La cuenta ya existe. Use el segundo botón para iniciar sesión y reparar el perfil.','info');else show('No se pudo crear la cuenta: '+t,'err')}});
document.getElementById('loginBtn').addEventListener('click',async()=>{if(!valid())return;show('Iniciando sesión…');try{const {error}=await client.auth.signInWithPassword({email,password:pass.value});if(error)throw error;await activate()}catch(e){show('No se pudo iniciar sesión: '+String(e.message||e)+'. Verifique que el correo esté confirmado y que la contraseña sea correcta.','err')}});
</script>
</body>
</html>
